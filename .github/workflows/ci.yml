name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: bundle size gate (dist/index.html + fonts)
        run: |
          test -f dist/index.html
          test -f dist/fonts/russo-one-cyrillic-400.woff2
          size=$(stat -c%s dist/index.html)
          echo "dist/index.html = $size bytes"
          test "$size" -lt 1572864
      - name: subfolder deploy gate (non-root base)
        run: |
          # Rebuild under a subpath and assert no absolute asset reference
          # survives: an absolute /fonts or /models ref 404s whenever the game
          # is not served from the domain root.
          BASE_PATH=/game/ npm run build
          test -f dist/index.html
          test -f dist/fonts/russo-one-cyrillic-400.woff2
          if grep -qE 'url\(/|src="/|href="/' dist/index.html; then
            echo "::error::absolute asset reference found — subfolder deploy would 404"
            grep -oE 'url\(/[^)]*\)|src="/[^"]*"|href="/[^"]*"' dist/index.html | head -10
            exit 1
          fi
          echo "no absolute asset refs — subfolder deploy OK"
