name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: bundle size gate (dist/index.html + fonts)
        run: |
          test -f dist/index.html
          test -f dist/fonts/russo-one-cyrillic-400.woff2
          size=$(stat -c%s dist/index.html)
          echo "dist/index.html = $size bytes"
          test "$size" -lt 1572864
